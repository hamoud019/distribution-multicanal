version: 2

models:
  - name: stg_erp__locations
    description: Factory/warehouse and own stores, from Business Central.
    columns:
      - name: location_code
        data_tests: [unique, not_null]

  - name: stg_erp__items
    description: One row per SKU, from Business Central. Prices and costs exclude VAT.
    columns:
      - name: sku
        data_tests: [unique, not_null]
      - name: product_code
        description: The model the SKU belongs to (all sizes), from the SKU code.
      - name: unit_cost
        description: Production cost of one unit, excluding VAT.
        data_tests: [not_null]

  - name: stg_erp__sales_lines
    description: Wholesale order lines from Business Central. Amounts exclude VAT.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: sku
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp__items')
                field: sku

  - name: stg_erp__gl_entries
    description: Monthly revenue per channel in the general ledger, as finance closes it. The reference for reconciliation.
    columns:
      - name: entry_no
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Web", "Store", "Wholesale"]
      - name: revenue
        description: Net revenue booked on the account, excluding VAT, positive for a sale.

  - name: stg_erp__stock
    description: >
      Stock snapshots from Business Central: one row per snapshot date, location and SKU. The date comes from
      the file name. One snapshot a week in the proof of concept, one a day in production.
    data_tests:
      - unique:
          column_name: "snapshot_date || '|' || location_code || '|' || sku"
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: location_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp__locations')
                field: location_code
      - name: sku
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp__items')
                field: sku
      - name: stock_on_hand
        data_tests: [not_null]

  - name: stg_erp__production_orders
    description: Finished production orders from Business Central, one batch of one SKU each.
    columns:
      - name: production_order
        data_tests: [unique, not_null]
      - name: sku
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp__items')
                field: sku
