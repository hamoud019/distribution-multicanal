name: lsf_poc
version: "0.1.0"
config-version: 2
profile: lsf_poc

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  vat_rate: 0.20  # French standard VAT: net revenue excludes it (glossary, Part 6)
  # Largest accepted gap between the sales mart and the ERP general ledger, per month and channel,
  # as a share of the ERP figure (Part 4, section 4: our choice, to be agreed with the CFO)
  reconciliation_tolerance: 0.005
  # RFM segments (Customer mart): orders of the last 24 months (glossary, RFM segment), and the days since
  # the last order that give recency scores 5, 4, 3 and 2; older is 1 (our assumption)
  rfm_window_months: 24
  rfm_recency_days: [30, 90, 180, 365]
  # Inventory thresholds (glossary, Part 6): demand is the units sold over the last 28 days, a SKU is
  # overstocked above 180 days of cover, and at risk of a stockout below 14 days (our assumption: two
  # weeks for the factory or the warehouse to send more, to be agreed with the supply chain director)
  demand_window_days: 28
  overstock_cover_days: 180
  stockout_risk_cover_days: 14

models:
  lsf_poc:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
